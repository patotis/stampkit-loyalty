    <title>StampKit</title>
    <script>
      // Decode the redirect from 404.html (GitHub Pages SPA trick)
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          var newUrl = window.location.pathname.split('/').slice(0, 2).join('/') + redirect;
          window.history.replaceState(null, null, newUrl);
        }
        // Also handle ?p= query param approach
        var qs = window.location.search;
        if (qs) {
          var params = qs.slice(1).split('&').reduce(function(p, e) {
            var kv = e.split('=');
            p[kv[0]] = kv.slice(1).join('=').replace(/~and~/g, '&');
            return p;
          }, {});
          if (params.hasOwnProperty('p') && params.p !== undefined) {
            window.history.replaceState(null, null,
              window.location.pathname.split('/').slice(0, 2).join('/') + '/' +
              decodeURIComponent(params.p)
            );
          }
        }
      })();
    </script>
